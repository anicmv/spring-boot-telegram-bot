server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/telegram_bot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

bot:
  telegram:
    token:
    username:
    channel-id:
    network:
      connect-timeout-seconds: 30
      read-timeout-seconds: 60
      write-timeout-seconds: 60
    ai:
      system-prompt: "你是一个 Telegram 中文助手。始终使用中文对话，回答简洁、直接，只保留必要信息。"
      blacklist-user-ids:
        - 11111
      auto-delete-enabled: true
      auto-delete-delay-seconds: 30
      # /ai 对话开启百炼联网搜索（enable_search），画像分析链路不受影响
      web-search-enabled: true
    profile:
      # 群聊消息记录总开关
      record-enabled: false
      # 群白名单（超级群 ID 以 -100 开头），仅记录这些群的消息
      record-group-ids: []
      # 单人单轮分析的最大消息条数
      batch-message-limit: 100
      # /profile 是否允许通过 @username 直接查他人画像
      allow-query-others: false
      # /profile 是否每次现场强制重新生成画像；画像格式调整期临时开启，稳定后关闭改由每晚跑批更新
      regenerate-on-query: true
      # /profile 授权管理员：仅其点击授权按钮生效，且 admin 免白名单直接用 /profile；普通用户白名单存 profile_allow_user 表
      admin-user-ids: []
      # 画像产出后延时清理命令消息与画像消息（审批申请消息不清理）
      auto-delete-enabled: true
      auto-delete-delay-seconds: 300
  douyin:
    # 是否下载并上传视频文件；false 时仅发送解析后的富文本信息。
    upload-video-enabled: true
    # 抖音接口风控时需要 Cookie，可直接填入或通过 DOUYIN_COOKIE 环境变量注入。
    cookie: ${DOUYIN_COOKIE:}
# 男娘指数自定义配置
maf:
  custom-levels:
    # userId: level (-1..100)
    7613486483: 60
    948540601: -1

logging:
  level:
    root: INFO
    com.github.anicmv: DEBUG

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# xxl-job 执行器配置
xxl:
  job:
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8081/xxl-job-admin}
    executor:
      appname: telegram-bot-executor
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job/jobhandler}
      log-retention-days: 30
